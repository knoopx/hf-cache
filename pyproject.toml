[project]
name = "hf-cache"
version = "0.1.0"
description = "A TUI app to browse and manage locally downloaded Hugging Face models and datasets"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "rich>=14",
    "textual>=8",
]

[project.scripts]
hf-cache = "hf_cache.__main__:main"

[tool.setuptools.packages.find]
include = ["hf_cache*"]

[dependency-groups]
dev = [
    "ruff>=0.15",
]
